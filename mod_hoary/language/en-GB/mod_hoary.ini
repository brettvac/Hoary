MOD_HOARY="Hoary Theme Switcher"
MOD_HOARY_DESCRIPTION="This module enables users to switch between dark and light mode on a Joomla! front end template."
MOD_HOARY_FIELD_DARKMODE_LABEL="Show Label"
MOD_HOARY_FIELD_DARKMODE_DESC="Show or hide the text label next to the icon."
MOD_HOARY_CACHE_NOTE_LABEL="Important Caching Setup Required"
MOD_HOARY_CACHE_NOTE_DESC="To prevent flashes when dark mode is set, verify the following settings:<br /><strong>1. Module Caching:</strong> In the Advanced tab, ensure caching is set to 'none'.<br /><strong>2. Page Cache Plugin:</strong> Ensure 'System - Page Cache' plugin is <strong>Disabled</strong> or excluded for your page.<br /><strong>3. Global Cache:</strong> In Global Configuration -> System, 'System Cache' should be set to 'ON - Conservative caching'."
MOD_HOARY_FIELD_ICON_STYLE_LABEL="Icon Style"
MOD_HOARY_FIELD_ICON_STYLE_DESC="Choose between native Emoji or FontAwesome icons."
MOD_HOARY_LABEL_ICON_STYLE_EMOJI="Emoji"
MOD_HOARY_LABEL_ICON_STYLE_FA="FontAwesome"
MOD_HOARY_SWITCHER="Toggle Theme"
MOD_HOARY_DARK="Dark"
MOD_HOARY_LIGHT="Light"