MOD_HOARY="Hoary Theme Switcher"
MOD_HOARY_DESCRIPTION="Ce module permet aux utilisateurs de basculer entre le mode sombre et le mode clair sur un template frontal Joomla!."
MOD_HOARY_FIELD_DARKMODE_LABEL="Afficher l'étiquette"
MOD_HOARY_FIELD_DARKMODE_DESC="Afficher ou masquer l'étiquette de texte à côté de l'icône."
MOD_HOARY_CACHE_NOTE_LABEL="Configuration importante du cache requise"
MOD_HOARY_CACHE_NOTE_DESC="Pour éviter les flashs lorsque le mode sombre est activé, vérifiez les paramètres suivants :<br /><strong>1. Cache du module :</strong> Dans l'onglet Paramètres avancés, assurez-vous que la mise en cache est définie sur « Aucun ».<br /><strong>2. Plugin Cache de page :</strong> Assurez-vous que le plugin « Système - Cache de page » est <strong>Désactivé</strong> ou exclu pour votre page.<br /><strong>3. Cache global :</strong> Dans Configuration globale -> Système, le « Cache système » doit être défini sur « OUI - Mise en cache conservative »."
MOD_HOARY_FIELD_ICON_STYLE_LABEL="Style d'icône"
MOD_HOARY_FIELD_ICON_STYLE_DESC="Choisissez entre les icônes natives Emoji ou FontAwesome."
MOD_HOARY_LABEL_ICON_STYLE_EMOJI="Emoji"
MOD_HOARY_LABEL_ICON_STYLE_FA="Font Awesome"
MOD_HOARY_SWITCHER="Basculer le thème"
MOD_HOARY_DARK="Sombre"
MOD_HOARY_LIGHT="Clair"